; Bird feeder for the Waveshare ESP32-S3-Touch-AMOLED-1.8 (V2).
;
; ESP-IDF through PlatformIO. src_dir = main keeps the plain ESP-IDF layout, so
; the same tree also builds with `idf.py build`.

[platformio]
src_dir = main
default_envs = feeder

[env:feeder]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages =
  tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.1.2/esptool.zip
framework = espidf
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
